spring:
  mvc:
    servlet:
      path: /api
  application:
    name: chatop-api
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}


#Log level configuration
logging:
  level:
    root: ERROR
    com:
      openclassroom: INFO
    org:
      hibernate:
        sql: INFO
        type:
          descriptor:
            sql: TRACE
      springframework:
        security: DEBUG